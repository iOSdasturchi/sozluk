<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Türkçe — A1 darajasidan boshlab o'zbek tilidagi o'quvchilar uchun turk tili o'rganish platformasi. Duolingo uslubidagi o'yin va mashqlar." />
  <title>Türkçe — Turk tilini o'rganing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- App container -->
  <div id="app"></div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-tab" id="nav-home" data-route="#home" aria-label="Asosiy">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Asosiy</span>
    </button>
    <button class="nav-tab" id="nav-review" data-route="#review" aria-label="Takrorlash">
      <span class="nav-icon">🔁</span>
      <span class="nav-label">Takrorlash</span>
    </button>
    <button class="nav-tab" id="nav-profile" data-route="#profile" aria-label="Profil">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profil</span>
    </button>
  </nav>

  <!-- Main app module -->
  <script type="module">
    import { registerRoute, initRouter, navigate } from './js/router.js';
    import { renderHome }   from './views/home.js';
    import { renderUnit }   from './views/unit.js';
    import { renderLesson } from './views/lesson.js';
    import { renderResult } from './views/result.js';
    import { renderReview } from './views/review.js';
    import { renderVocab }  from './views/vocab.js';
    import { renderStory }  from './views/story.js';
    import { getStats, saveStats, getUnitProgress, saveUnitProgress } from './js/db.js';

    // ---- Streak check on load ----
    (function checkStreak() {
      const stats = getStats();
      const today = new Date().toDateString();
      if (stats.lastStudyDate !== today) {
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        if (stats.lastStudyDate !== yesterday && stats.lastStudyDate != null) {
          stats.streak = 0;
        }
        stats.dailyXP = 0;
        stats.dailyDate = today;
        saveStats(stats);
      }
    })();

    // ---- Profile view (inline) ----
    function renderProfile(container) {
      const stats = getStats();
      const up = getUnitProgress();
      const totalUnits = 6;
      const completedUnits = Object.values(up).filter(u => u.completed).length;

      container.innerHTML = `
        <div class="profile-screen">
          <header class="screen-header">
            <h1 class="screen-header-title">👤 Profil</h1>
          </header>

          <div class="profile-avatar-card">
            <div class="avatar-circle">🎓</div>
            <div class="profile-level-badge">A1</div>
          </div>

          <div class="profile-stats-grid">
            <div class="profile-stat-card">
              <div class="psc-icon">🔥</div>
              <div class="psc-value">${stats.streak || 0}</div>
              <div class="psc-label">Ketma-ketlik</div>
            </div>
            <div class="profile-stat-card">
              <div class="psc-icon">⚡</div>
              <div class="psc-value">${stats.totalXP || 0}</div>
              <div class="psc-label">Jami XP</div>
            </div>
            <div class="profile-stat-card">
              <div class="psc-icon">🏆</div>
              <div class="psc-value">${completedUnits}/${totalUnits}</div>
              <div class="psc-label">Birliklar</div>
            </div>
            <div class="profile-stat-card">
              <div class="psc-icon">🎯</div>
              <div class="psc-value">${stats.dailyXP || 0}</div>
              <div class="psc-label">Bugungi XP</div>
            </div>
          </div>

          <div class="profile-section">
            <h2 class="section-title">A1 Darajasi</h2>
            <div class="level-info-card">
              <div class="li-row">
                <span>Jami so'zlar</span><strong>953</strong>
              </div>
              <div class="li-row">
                <span>Birliklar</span><strong>6</strong>
              </div>
              <div class="li-row">
                <span>Tugallangan</span><strong>${completedUnits}</strong>
              </div>
            </div>
          </div>

          <div class="profile-section">
            <h2 class="section-title">☁️ Cloud Sync (Gist)</h2>
            <div style="background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border);">
              <label style="font-size: 14px; color: var(--text-muted); display: block; margin-bottom: 5px;">Github Token (PAT):</label>
              <input type="password" id="gist-token" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); margin-bottom: 10px;" placeholder="ghp_xxxxxxxx">
              
              <label style="font-size: 14px; color: var(--text-muted); display: block; margin-bottom: 5px;">Gist ID (Avtomatik to'ldiriladi):</label>
              <input type="text" id="gist-id" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); margin-bottom: 15px;" placeholder="gist id...">
              
              <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" id="gist-save-btn" style="flex: 1; padding: 10px; font-weight: 600;">💾 Saqlash</button>
                <button class="btn btn-primary" id="gist-sync-btn" style="flex: 1; padding: 10px; font-weight: 600; background: var(--success); color: white;">🔄 Sinxronlash</button>
              </div>
              <p id="gist-status" style="margin-top: 10px; font-size: 13px; color: var(--text-muted);"></p>
            </div>
            
            <h2 class="section-title">Sozlamalar</h2>
            <button class="danger-btn" id="reset-btn">
              🗑️ Ma'lumotlarni tozalash
            </button>
          </div>

          <div style="height:100px"></div>
        </div>
      `;

      // Setup Gist UI logic
      const tokenInput = container.querySelector('#gist-token');
      const idInput = container.querySelector('#gist-id');
      const statusText = container.querySelector('#gist-status');
      
      tokenInput.value = localStorage.getItem('turkce_gist_token') || '';
      idInput.value = localStorage.getItem('turkce_gist_id') || '';

      container.querySelector('#gist-save-btn').addEventListener('click', async () => {
        const token = tokenInput.value.trim();
        let gistId = idInput.value.trim();
        
        if (!token) {
          statusText.textContent = "Token kiriting!";
          return;
        }
        
        localStorage.setItem('turkce_gist_token', token);
        statusText.textContent = "Bog'lanmoqda...";
        
        try {
          const db = await import('./js/db.js');
          if (!gistId) {
            gistId = await db.createGist(token);
            idInput.value = gistId;
            statusText.textContent = "Yangi Gist yaratildi! Endi sinxronlash mumkin.";
          }
          localStorage.setItem('turkce_gist_id', gistId);
          statusText.textContent = "Saqlandi! Endi 'Sinxronlash'ni bosing.";
        } catch (e) {
          statusText.textContent = "Xatolik: " + e.message;
        }
      });

      container.querySelector('#gist-sync-btn').addEventListener('click', async () => {
        const token = localStorage.getItem('turkce_gist_token');
        const gistId = localStorage.getItem('turkce_gist_id');
        if (!token || !gistId) {
          statusText.textContent = "Avval saqlang!";
          return;
        }
        
        statusText.textContent = "Sinxronlanmoqda...";
        try {
          const db = await import('./js/db.js');
          
          // Try to sync down first
          const updated = await db.syncFromGist(token, gistId);
          if (updated) {
            statusText.textContent = "Bulutdan ma'lumot yuklandi (Sinxronlandi) ✅";
            // reload profile data if needed
            return;
          }
          
          // If local was newer, sync up
          await db.syncToGist(token, gistId);
          statusText.textContent = "Bulutga ma'lumot yozildi (Sinxronlandi) ✅";
          
        } catch (e) {
          statusText.textContent = "Xatolik: " + e.message;
        }
      });

      container.querySelector('#reset-btn').addEventListener('click', () => {
        if (confirm("Barcha progress o'chiriladi. Davom etasizmi?")) {
          import('./js/db.js').then(db => {
            db.clearAll();
            navigate('#home');
          });
        }
      });
    }

    // ---- Route Registration ----
    registerRoute('#home',    (c) => renderHome(c));
    registerRoute('#unit',    (c, p) => renderUnit(c, p));
    registerRoute('#lesson',  (c, p) => renderLesson(c, p));
    registerRoute('#result',  (c, p) => renderResult(c, p));
    registerRoute('#review', renderReview);
    registerRoute('#vocab', renderVocab);
    registerRoute('#story', renderStory);
    registerRoute('#profile', renderProfile);

    // ---- Bottom Nav ----
    const navTabs = document.querySelectorAll('.nav-tab');
    const LESSON_ROUTES = new Set(['#lesson', '#result']);

    function updateNav(route) {
      const showNav = !LESSON_ROUTES.has(route);
      document.getElementById('bottom-nav').style.display = showNav ? 'flex' : 'none';
      navTabs.forEach(tab => {
        tab.classList.toggle('nav-tab--active', tab.dataset.route === route);
      });
    }

    navTabs.forEach(tab => {
      tab.addEventListener('click', () => navigate(tab.dataset.route));
    });

    // Watch hash changes for nav update
    window.addEventListener('hashchange', () => {
      updateNav(window.location.hash || '#home');
    });

    // Init
    initRouter();
    updateNav(window.location.hash || '#home');

  </script>

</body>
</html>
